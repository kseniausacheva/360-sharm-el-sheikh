
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Podcast 360 | Photo & Video Studio Sharm El-Sheikh</title>
    
    <!-- External Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700;800&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Inline Styles -->
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #050505;
        color: #ffffff;
        margin: 0;
      }
      h1, h2, h3, .font-exo {
        font-family: 'Exo 2', sans-serif;
      }
      .metallic-blue {
        color: #0051ff;
      }
      .bg-metallic-blue {
        background-color: #0051ff;
      }
      .border-metallic-blue {
        border-color: #0051ff;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .hall-card:hover .hall-overlay {
        opacity: 1;
      }
      .hall-overlay {
        transition: opacity 0.5s ease;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #111;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #0051ff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Inline JavaScript (React + JSX via Babel) -->
    <script type="text/babel">
      const { useState, useEffect } = React;

      // Icon Component using Lucide
      const Icon = ({ name, size = 24, className = "" }) => {
        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, []);
        return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
      };

      const Navbar = () => {
        const [isOpen, setIsOpen] = useState(false);
        const [scrolled, setScrolled] = useState(false);

        useEffect(() => {
          const handleScroll = () => setScrolled(window.scrollY > 50);
          window.addEventListener('scroll', handleScroll);
          return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        const navLinks = [
          { name: 'Home', href: '#home' },
          { name: 'About', href: '#about' },
          { name: 'Studios', href: '#halls' },
          { name: 'Pricing', href: '#pricing' },
          { name: 'Contact', href: '#contact' },
        ];

        return (
          <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'bg-black/90 backdrop-blur-md py-4 border-b border-white/10' : 'bg-transparent py-6'}`}>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between items-center">
                <div className="flex items-center space-x-2">
                  <div className="w-10 h-10 bg-[#0051ff] rounded-full flex items-center justify-center">
                    <span className="text-white font-bold text-xl">360</span>
                  </div>
                  <span className="text-2xl font-bold tracking-tighter font-exo uppercase">Podcast <span className="metallic-blue">360</span></span>
                </div>

                <div className="hidden md:flex space-x-8">
                  {navLinks.map((link) => (
                    <a key={link.name} href={link.href} className="text-xs font-bold hover:text-[#0051ff] transition-colors uppercase tracking-[0.2em]">{link.name}</a>
                  ))}
                </div>

                <div className="hidden md:block">
                  <button className="bg-[#0051ff] hover:bg-blue-700 text-white px-6 py-2 rounded-sm font-bold transition-all transform hover:scale-105 uppercase tracking-wider text-xs">Book Now</button>
                </div>

                <div className="md:hidden">
                  <button onClick={() => setIsOpen(!isOpen)} className="text-white">
                    <Icon name={isOpen ? "x" : "menu"} size={28} />
                  </button>
                </div>
              </div>
            </div>

            {/* Mobile Menu */}
            <div className={`md:hidden absolute top-full left-0 w-full bg-black border-t border-white/10 transition-all duration-300 overflow-hidden ${isOpen ? 'h-screen opacity-100' : 'h-0 opacity-0'}`}>
              <div className="flex flex-col items-center py-12 space-y-8">
                {navLinks.map((link) => (
                  <a key={link.name} href={link.href} onClick={() => setIsOpen(false)} className="text-2xl font-exo font-bold hover:metallic-blue transition-colors uppercase">{link.name}</a>
                ))}
                <button className="bg-[#0051ff] text-white px-10 py-4 rounded-sm font-bold text-lg uppercase">Book Now</button>
              </div>
            </div>
          </nav>
        );
      };

      const Hero = () => (
        <section id="home" className="relative min-h-screen flex items-center pt-20 overflow-hidden">
          <div className="absolute inset-0 z-0">
            <div className="absolute inset-0 bg-gradient-to-r from-black via-black/80 to-transparent z-10"></div>
            <img src="https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?q=80&w=2070&auto=format&fit=crop" className="w-full h-full object-cover grayscale opacity-30" alt="Studio" />
            <div className="absolute top-1/4 right-1/4 w-96 h-96 bg-[#0051ff]/10 rounded-full blur-[120px] animate-pulse"></div>
          </div>
          <div className="relative z-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
            <div className="max-w-3xl">
              <div className="inline-block px-4 py-1 bg-[#0051ff]/20 border border-[#0051ff] mb-6">
                <span className="text-[10px] font-bold tracking-[0.4em] metallic-blue uppercase">Premier Content Studio Sharm El-Sheikh</span>
              </div>
              <h1 className="text-6xl md:text-9xl font-black font-exo leading-[0.9] mb-8 uppercase italic">
                REELS <br />
                <span className="relative inline-block text-[#0051ff]">THAT GO</span> <br />
                VIRAL
              </h1>
              <p className="text-lg md:text-2xl text-gray-400 font-light max-w-lg mb-12 leading-relaxed">
                Unlock viral growth with world-class production. Professional filming and crystal-clear sound in Egypt's finest studio.
              </p>
              <div className="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-8">
                <button className="bg-[#0051ff] hover:bg-blue-700 text-white px-12 py-5 rounded-sm font-bold text-lg transition-all flex items-center justify-center uppercase group">
                  Book Session <Icon name="chevron-right" size={20} className="ml-2 group-hover:translate-x-1 transition-transform" />
                </button>
                <button className="flex items-center justify-center space-x-3 text-white font-bold hover:metallic-blue transition-colors group">
                  <span className="border-b border-white group-hover:border-[#0051ff] pb-1 uppercase tracking-widest text-sm">Our Portfolio</span>
                  <Icon name="arrow-right" size={20} className="group-hover:translate-x-1 transition-transform" />
                </button>
              </div>
            </div>
          </div>
        </section>
      );

      const About = () => (
        <section id="about" className="py-32 bg-[#080808]">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-24 items-center">
              <div className="relative">
                 <div className="absolute -top-10 -left-10 w-40 h-40 border-t-2 border-l-2 border-[#0051ff] opacity-50"></div>
                 <img src="https://images.unsplash.com/photo-1590602847861-f357a9332bbc?q=80&w=1974&auto=format&fit=crop" alt="Studio History" className="relative z-10 w-full rounded-sm grayscale hover:grayscale-0 transition-all duration-700" />
                 <div className="absolute -bottom-8 -right-8 bg-[#0051ff] p-10 z-20 hidden md:block">
                   <span className="block text-5xl font-black font-exo">8+</span>
                   <span className="text-[10px] uppercase tracking-[0.2em] font-bold">Years of Excellence</span>
                 </div>
              </div>
              <div>
                <h2 className="text-5xl md:text-7xl font-black font-exo mb-10 uppercase italic">OUR <span className="metallic-blue">STORY</span></h2>
                <div className="space-y-8 text-gray-400 text-xl leading-relaxed font-light">
                  <p>Born in the vibrant heart of Sharm El-Sheikh, Podcast 360 is Egypt's leading hub for digital storytellers and content creators.</p>
                  <p>We believe high-end production should be seamless. Our studios feature industry-standard Arri and Aputure lighting, multi-cam 4K setups, and acoustic treatment that guarantees broadcast-quality audio.</p>
                  <p>From CEOs to YouTube stars, we provide the ultimate environment to capture attention and scale your brand.</p>
                </div>
                <div className="mt-12 grid grid-cols-2 gap-12 border-t border-white/5 pt-12">
                  <div>
                    <h4 className="text-white font-black text-3xl mb-1">5k+</h4>
                    <p className="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Hours Recorded</p>
                  </div>
                  <div>
                    <h4 className="text-white font-black text-3xl mb-1">750+</h4>
                    <p className="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Creators Served</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      );

      const Studios = () => {
        const halls = [
          { id: '1', name: 'PODCAST 360°', price: 'FROM 2,500 EGP / HR', img: 'photo_2026-01-02_18-56-36.jpg', desc: 'The flagship studio. Neon vibes, 4-cam setup, perfect for high-energy shows.' },
          { id: '2', name: 'EPOS LOFT', price: 'FROM 1,800 EGP / HR', img: 'https://images.unsplash.com/photo-1590602847861-f357a9332bbc?q=80&w=1974&auto=format&fit=crop', desc: 'Minimalist industrial aesthetics. Ideal for business interviews and corporate content.' },
          { id: '3', name: 'DIALOG', price: 'FROM 1,200 EGP / HR', img: 'https://images.unsplash.com/photo-1478737270239-2f02b77fc618?q=80&w=2070&auto=format&fit=crop', desc: 'Intimate setting for deep conversations. Warm lighting and cozy acoustics.' },
          { id: '4', name: 'PREP ROOM', price: 'FROM 300 EGP / HR', img: 'https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?q=80&w=2087&auto=format&fit=crop', desc: 'Professional MUA mirrors and prep area to ensure you look perfect on camera.' }
        ];

        return (
          <section id="halls" className="py-32 bg-black">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center mb-20">
                <h2 className="text-5xl md:text-8xl font-black font-exo mb-6 uppercase">THE <span className="metallic-blue">STUDIOS</span></h2>
                <p className="text-gray-500 max-w-2xl mx-auto uppercase tracking-widest text-xs font-bold">Premium sets curated for maximum engagement and brand authority.</p>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                {halls.map((hall) => (
                  <div key={hall.id} className="relative h-[650px] group overflow-hidden cursor-pointer hall-card">
                    <img src={hall.img} className="w-full h-full object-cover grayscale group-hover:grayscale-0 group-hover:scale-105 transition-all duration-700" alt={hall.name} />
                    <div className="absolute inset-0 bg-gradient-to-t from-black via-black/30 to-transparent opacity-90 group-hover:opacity-100 transition-opacity"></div>
                    <div className="absolute bottom-0 left-0 w-full p-10 z-20 transform group-hover:-translate-y-4 transition-transform duration-500">
                      <h3 className="text-3xl font-black font-exo mb-2 uppercase italic">{hall.name}</h3>
                      <p className="text-[#0051ff] font-black tracking-[0.2em] text-[10px] mb-6">{hall.price}</p>
                      <div className="hall-overlay opacity-0 group-hover:opacity-100">
                        <p className="text-gray-400 text-sm mb-8 leading-relaxed font-light">{hall.desc}</p>
                        <button className="bg-[#0051ff] w-full py-4 font-black text-[10px] uppercase tracking-[0.3em] hover:bg-blue-600 transition-colors">Book Now</button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>
        );
      };

      const Pricing = () => {
        const plans = [
          { num: '01', title: 'RENTAL', price: '1,200 EGP / HR', features: ['Self-managed production', 'Fiber-optic high-speed internet', 'Basic lighting package included'] },
          { num: '02', title: 'FILMING', price: '4,500 EGP / HR', features: ['Professional cameraman & sound op', '4K Multi-cam recording', 'Raw footage delivery same-day'] },
          { num: '03', title: 'FULL CYCLE', price: '8,500 EGP / HR', features: ['Film + Sound + Pro Editing', 'Color grading & branding', 'Viral hook formatting for Reels'] }
        ];

        return (
          <section id="pricing" className="py-32 bg-[#050505] relative overflow-hidden">
            <div className="absolute top-0 right-0 w-1/4 h-full bg-[#0051ff]/5 skew-x-12 transform translate-x-1/2"></div>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
              <div className="text-center mb-24">
                <h2 className="text-5xl md:text-8xl font-black font-exo mb-6 uppercase">PRICING <span className="metallic-blue">PLANS</span></h2>
                <div className="inline-block bg-[#0051ff] text-white px-6 py-2 text-xl font-black font-exo uppercase italic">Sharm El-Sheikh Exclusives</div>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                {plans.map((plan) => (
                  <div key={plan.num} className="glass-card p-12 flex flex-col h-full hover:border-[#0051ff]/40 transition-all duration-500 group">
                    <div className="flex justify-between items-start mb-12">
                      <h3 className="text-4xl font-black font-exo uppercase italic leading-none">{plan.title}</h3>
                      <span className="text-6xl font-black font-exo metallic-blue opacity-20 group-hover:opacity-100 transition-opacity">{plan.num}</span>
                    </div>
                    <ul className="space-y-6 flex-grow">
                      {plan.features.map((f, i) => (
                        <li key={i} className="flex items-start text-gray-400 text-sm font-light leading-relaxed">
                          <div className="w-1.5 h-1.5 bg-[#0051ff] rounded-full mt-2 mr-4 flex-shrink-0"></div>
                          {f}
                        </li>
                      ))}
                    </ul>
                    <div className="mt-16 flex items-center justify-between">
                      <div className="text-2xl font-black font-exo metallic-blue tracking-tighter">{plan.price}</div>
                      <button className="bg-[#0051ff] text-white p-4 hover:bg-blue-600 transition-all transform hover:rotate-45"><Icon name="arrow-right" size={20} /></button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>
        );
      };

      const Contact = () => (
        <section id="contact" className="py-32 bg-black">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-24">
              <div>
                <h2 className="text-5xl md:text-8xl font-black font-exo mb-16 uppercase italic leading-[0.8]">STAY IN <br/><span className="metallic-blue">TOUCH</span></h2>
                <div className="space-y-12">
                  <div className="flex items-start space-x-8">
                    <div className="w-16 h-16 bg-white/5 flex items-center justify-center text-[#0051ff]"><Icon name="map-pin" size={28} /></div>
                    <div>
                      <h4 className="text-xs font-black mb-2 uppercase tracking-[0.3em] text-gray-500">Address</h4>
                      <p className="text-gray-300 font-light text-lg">Naama Bay Promenade, Sharm El-Sheikh, South Sinai, Egypt</p>
                    </div>
                  </div>
                  <div className="flex items-start space-x-8">
                    <div className="w-16 h-16 bg-white/5 flex items-center justify-center text-[#0051ff]"><Icon name="clock" size={28} /></div>
                    <div>
                      <h4 className="text-xs font-black mb-2 uppercase tracking-[0.3em] text-gray-500">Hours</h4>
                      <p className="text-gray-300 font-light text-lg">Daily: 10:00 AM — 10:00 PM<br/><span className="text-[#0051ff] text-xs font-bold">24/7 shoots available upon request</span></p>
                    </div>
                  </div>
                  <div className="flex items-start space-x-8">
                    <div className="w-16 h-16 bg-white/5 flex items-center justify-center text-[#0051ff]"><Icon name="phone" size={28} /></div>
                    <div>
                      <h4 className="text-xs font-black mb-2 uppercase tracking-[0.3em] text-gray-500">WhatsApp</h4>
                      <p className="text-white font-black text-3xl tracking-tighter">+201101005061</p>
                    </div>
                  </div>
                </div>
                <div className="mt-16 flex space-x-6">
                  <a href="#" className="w-14 h-14 bg-white/5 hover:bg-[#0051ff] transition-all flex items-center justify-center"><Icon name="instagram" /></a>
                  <a href="#" className="w-14 h-14 bg-white/5 hover:bg-[#0051ff] transition-all flex items-center justify-center"><Icon name="youtube" /></a>
                  <a href="#" className="w-14 h-14 bg-white/5 hover:bg-[#0051ff] transition-all flex items-center justify-center"><span className="font-black text-xs uppercase">TG</span></a>
                </div>
              </div>
              <div className="bg-[#0a0a0a] border border-white/5 p-10 md:p-16 relative">
                <div className="absolute top-0 left-0 w-2 h-full bg-[#0051ff]"></div>
                <h3 className="text-3xl font-black font-exo mb-12 uppercase italic">BOOK THE <span className="metallic-blue">FUTURE</span></h3>
                <form className="space-y-8" onSubmit={(e) => e.preventDefault()}>
                  <div>
                    <label className="block text-[10px] uppercase font-black text-gray-600 mb-3 tracking-widest">Full Name</label>
                    <input type="text" className="w-full bg-white/5 border-b border-white/10 p-4 outline-none focus:border-[#0051ff] transition-colors text-white font-light" placeholder="John Doe" />
                  </div>
                  <div>
                    <label className="block text-[10px] uppercase font-black text-gray-600 mb-3 tracking-widest">WhatsApp Number</label>
                    <input type="tel" className="w-full bg-white/5 border-b border-white/10 p-4 outline-none focus:border-[#0051ff] transition-colors text-white font-light" placeholder="+20..." />
                  </div>
                  <div>
                    <label className="block text-[10px] uppercase font-black text-gray-600 mb-3 tracking-widest">Select Service</label>
                    <select className="w-full bg-white/5 border-b border-white/10 p-4 outline-none focus:border-[#0051ff] transition-colors text-white font-light appearance-none uppercase tracking-tighter">
                      <option className="bg-black">Studio Rental</option>
                      <option className="bg-black">Reels / Shorts Filming</option>
                      <option className="bg-black">Podcast Session</option>
                      <option className="bg-black">Full Production Cycle</option>
                    </select>
                  </div>
                  <button className="w-full bg-[#0051ff] py-6 font-black uppercase tracking-[0.4em] text-xs hover:bg-blue-600 transition-all shadow-[0_20px_40px_rgba(0,81,255,0.3)]">SEND REQUEST</button>
                  <p className="text-[10px] text-gray-700 text-center uppercase font-bold mt-8 tracking-widest">CONFIDENTIALITY GUARANTEED</p>
                </form>
              </div>
            </div>
          </div>
        </section>
      );

      const Footer = () => (
        <footer className="py-20 border-t border-white/5 bg-[#050505]">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex flex-col md:flex-row justify-between items-center space-y-10 md:space-y-0">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 bg-[#0051ff] rounded-full flex items-center justify-center font-black">360</div>
                <span className="text-2xl font-black tracking-tighter font-exo uppercase">Podcast <span className="metallic-blue">360</span></span>
              </div>
              <div className="text-gray-600 text-[10px] uppercase font-bold tracking-[0.2em]">
                © {new Date().getFullYear()} Podcast 360 Egypt. Built for the next generation of creators.
              </div>
              <div className="flex space-x-10 text-[10px] font-black uppercase tracking-[0.3em] text-gray-600">
                <a href="#" className="hover:text-white transition-colors">Privacy</a>
                <a href="#" className="hover:text-white transition-colors">Terms</a>
              </div>
            </div>
          </div>
        </footer>
      );

      const App = () => {
        return (
          <div className="flex flex-col min-h-screen">
            <Navbar />
            <Hero />
            <About />
            <Studios />
            <Pricing />
            <Contact />
            <Footer />
            
            {/* Cookie Notification */}
            <div className="fixed bottom-8 left-8 z-[100] bg-white/5 backdrop-blur-2xl border border-white/10 p-6 rounded-sm shadow-2xl flex items-center space-x-6 max-w-sm">
              <div className="text-3xl">🍪</div>
              <div className="flex-1">
                <p className="text-[10px] text-gray-400 uppercase font-black tracking-widest mb-1">Cookies Policy</p>
                <p className="text-xs font-light">We use tech to improve your experience.</p>
              </div>
              <button className="bg-[#0051ff] text-white px-5 py-2 text-[10px] font-black uppercase">Got it</button>
            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
