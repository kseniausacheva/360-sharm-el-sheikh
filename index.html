
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Podcast 360 | Photo & Video Studio Sharm El-Sheikh</title>
    
    <!-- External Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700;800&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Inline Styles -->
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #050505;
        color: #ffffff;
        margin: 0;
      }
      h1, h2, h3, .font-exo {
        font-family: 'Exo 2', sans-serif;
      }
      .metallic-blue {
        color: #0051ff;
      }
      .bg-metallic-blue {
        background-color: #0051ff;
      }
      .border-metallic-blue {
        border-color: #0051ff;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .hall-card:hover .hall-overlay {
        opacity: 1;
      }
      .hall-overlay {
        transition: opacity 0.5s ease;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #111;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #0051ff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Inline JavaScript (React + JSX via Babel) -->
    <script type="text/babel">
      const { useState, useEffect } = React;

      // Icon Component using Lucide
      const Icon = ({ name, size = 24, className = "" }) => {
        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, []);
        return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
      };

      const Navbar = () => {
        const [isOpen, setIsOpen] = useState(false);
        const [scrolled, setScrolled] = useState(false);

        useEffect(() => {
          const handleScroll = () => setScrolled(window.scrollY > 50);
          window.addEventListener('scroll', handleScroll);
          return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        const navLinks = [
          { name: 'Home', href: '#home' },
          { name: 'About', href: '#about' },
          { name: 'Studios', href: '#halls' },
          { name: 'Pricing', href: '#pricing' },
          { name: 'Contact', href: '#contact' },
        ];

        return (
          <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'bg-black/90 backdrop-blur-md py-4 border-b border-white/10' : 'bg-transparent py-6'}`}>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between items-center">
                <div className="flex items-center space-x-2">
                  <div className="w-10 h-10 bg-[#0051ff] rounded-full flex items-center justify-center">
                    <span className="text-white font-bold text-xl">360</span>
                  </div>
                  <span className="text-2xl font-bold tracking-tighter font-exo uppercase">Podcast <span className="metallic-blue">360</span></span>
                </div>

                <div className="hidden md:flex space-x-8">
                  {navLinks.map((link) => (
                    <a key={link.name} href={link.href} className="text-xs font-bold hover:text-[#0051ff] transition-colors uppercase tracking-[0.2em]">{link.name}</a>
                  ))}
                </div>

                <div className="hidden md:block">
                  <button className="bg-[#0051ff] hover:bg-blue-700 text-white px-6 py-2 rounded-sm font-bold transition-all transform hover:scale-105 uppercase tracking-wider text-xs">Book Now</button>
                </div>

                <div className="md:hidden">
                  <button onClick={() => setIsOpen(!isOpen)} className="text-white">
                    <Icon name={isOpen ? "x" : "menu"} size={28} />
                  </button>
                </div>
              </div>
            </div>

            {/* Mobile Menu */}
            <div className={`md:hidden absolute top-full left-0 w-full bg-black border-t border-white/10 transition-all duration-300 overflow-hidden ${isOpen ? 'h-screen opacity-100' : 'h-0 opacity-0'}`}>
              <div className="flex flex-col items-center py-12 space-y-8">
                {navLinks.map((link) => (
                  <a key={link.name} href={link.href} onClick={() => setIsOpen(false)} className="text-2xl font-exo font-bold hover:metallic-blue transition-colors uppercase">{link.name}</a>
                ))}
                <button className="bg-[#0051ff] text-white px-10 py-4 rounded-sm font-bold text-lg uppercase">Book Now</button>
              </div>
            </div>
          </nav>
        );
      };

      const VideoProduction = () => {
        const services = [
          'Podcasts / Interviews',
          'Reels',
          'YouTube Shows',
          'Live Streams',
          'Courses',
          'Whiteboard Videos'
        ];

        return (
          <section className="py-24 bg-gradient-to-r from-[#050505] via-[#0a0a1a] to-[#050505] relative overflow-hidden">
            <div className="absolute inset-0 bg-gradient-to-b from-transparent via-[#0051ff]/5 to-transparent"></div>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
              <h2 className="text-4xl md:text-6xl font-black font-exo mb-12 uppercase">
                PRODUCTION OF ANY<br/>
                <span className="metallic-blue">VIDEO CONTENT</span>
              </h2>
              <div className="flex flex-wrap gap-4">
                {services.map((service, index) => (
                  <button
                    key={index}
                    className="px-6 py-3 rounded-full border border-white/20 text-white text-sm font-medium hover:bg-[#0051ff] hover:border-[#0051ff] transition-all duration-300"
                  >
                    {service}
                  </button>
                ))}
              </div>
            </div>
          </section>
        );
      };

      const PodcastsInterviews = () => (
        <section className="min-h-screen bg-[#050505] relative overflow-hidden">
          <div className="absolute bottom-0 left-0 w-full h-2 bg-gradient-to-r from-[#0051ff] via-purple-500 to-[#0051ff]"></div>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-24">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
              <div>
                <h2 className="text-5xl md:text-7xl font-black font-exo mb-6 uppercase italic leading-[0.9]">
                  PODCASTS/<br/>
                  <span className="metallic-blue">INTERVIEWS</span>
                </h2>
                <div className="inline-block bg-[#0051ff] text-white px-4 py-2 text-sm font-bold uppercase mb-8">
                  Not Like Everyone Else
                </div>
                <p className="text-gray-400 text-xl leading-relaxed font-light mb-8">
                  We take podcasts to the next level. We shoot interviews like real TV shows — cinematic quality, multiple camera angles, and broadcast-ready audio.
                </p>
                <div className="mb-10">
                  <span className="text-gray-500 text-sm uppercase tracking-widest font-bold">from </span>
                  <span className="text-4xl font-black font-exo metallic-blue">2,500 EGP</span>
                  <span className="text-white text-xl font-bold"> / HOUR</span>
                </div>
                <div className="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-6">
                  <button className="bg-[#0051ff] hover:bg-blue-700 text-white px-10 py-4 rounded-sm font-bold transition-all uppercase tracking-wider text-sm">
                    Book Now
                  </button>
                  <button className="flex items-center space-x-2 text-white font-bold hover:text-[#0051ff] transition-colors group">
                    <span className="uppercase tracking-wider text-sm">Portfolio</span>
                    <Icon name="arrow-right" size={20} className="group-hover:translate-x-1 transition-transform" />
                  </button>
                </div>
              </div>
              <div className="relative">
                <div className="absolute -top-4 -right-4 w-full h-full border-2 border-[#0051ff]/30"></div>
                <img 
                  src="https://images.unsplash.com/photo-1478737270239-2f02b77fc618?q=80&w=2070&auto=format&fit=crop" 
                  alt="Podcast Interview" 
                  className="w-full h-[500px] object-cover relative z-10"
                />
                <div className="absolute bottom-0 right-0 w-1/2 h-1 bg-[#0051ff]"></div>
              </div>
            </div>
          </div>
        </section>
      );

      const ReelsSection = () => (
        <section className="min-h-screen bg-[#050505] relative overflow-hidden">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-24">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
              <div>
                <h2 className="text-6xl md:text-8xl font-black font-exo mb-6 uppercase text-gray-400 tracking-tighter">
                  REELS
                </h2>
                <div className="inline-block bg-[#0051ff] text-white px-4 py-2 text-sm font-bold uppercase mb-8">
                  That Go Viral
                </div>
                <p className="text-gray-400 text-xl leading-relaxed font-light italic mb-8">
                  We've cracked the algorithm. Learn how to hook and keep your audience engaged from the first second to the last.
                </p>
                <div className="mb-10">
                  <span className="text-gray-500 text-sm uppercase tracking-widest font-bold">from </span>
                  <span className="text-4xl font-black font-exo metallic-blue">1,500 EGP</span>
                  <span className="text-white text-xl font-bold"> / HOUR</span>
                </div>
                <div className="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-6">
                  <button className="bg-[#0051ff] hover:bg-blue-700 text-white px-10 py-4 rounded-sm font-bold transition-all uppercase tracking-wider text-sm">
                    Book Now
                  </button>
                  <button className="flex items-center space-x-2 text-white font-bold hover:text-[#0051ff] transition-colors group">
                    <span className="uppercase tracking-wider text-sm">Portfolio</span>
                    <Icon name="arrow-right" size={20} className="group-hover:translate-x-1 transition-transform" />
                  </button>
                </div>
              </div>
              <div className="relative flex gap-4">
                <div className="flex-1 relative">
                  <img 
                    src="https://images.unsplash.com/photo-1611162616305-c69b3fa7fbe0?q=80&w=1974&auto=format&fit=crop" 
                    alt="Reels Content Creator" 
                    className="w-full h-[500px] object-cover"
                  />
                  <div className="absolute inset-0 bg-gradient-to-t from-[#0051ff]/30 to-transparent"></div>
                </div>
                <div className="flex-1 relative mt-16">
                  <img 
                    src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1964&auto=format&fit=crop" 
                    alt="Content Creator" 
                    className="w-full h-[500px] object-cover"
                  />
                  <div className="absolute inset-0 bg-gradient-to-t from-[#0051ff]/30 to-transparent"></div>
                </div>
              </div>
            </div>
          </div>
        </section>
      );

      const YoutubeShowSection = () => (
        <section className="min-h-screen bg-[#050505] relative overflow-hidden">
          <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-[#0051ff] via-purple-500 to-[#0051ff]"></div>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-24">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
              <div>
                <h2 className="text-5xl md:text-7xl font-black font-exo mb-6 uppercase italic leading-[0.9] text-gray-400 tracking-tighter">
                  YOUTUBE<br/>
                  <span className="metallic-blue">SHOW</span>
                </h2>
                <div className="inline-block bg-[#0051ff] text-white px-4 py-2 text-sm font-bold uppercase mb-8">
                  That People Watch Till The End
                </div>
                <p className="text-gray-400 text-xl leading-relaxed font-light mb-8">
                  We develop individual concepts for rating shows. From idea to final cut — we create engaging YouTube content that keeps viewers hooked and coming back for more.
                </p>
                <div className="mb-10">
                  <span className="text-gray-500 text-sm uppercase tracking-widest font-bold">from </span>
                  <span className="text-4xl font-black font-exo metallic-blue">3,500 EGP</span>
                  <span className="text-white text-xl font-bold"> / HOUR</span>
                </div>
                <div className="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-6">
                  <button className="bg-[#0051ff] hover:bg-blue-700 text-white px-10 py-4 rounded-sm font-bold transition-all uppercase tracking-wider text-sm">
                    Book Now
                  </button>
                  <button className="flex items-center space-x-2 text-white font-bold hover:text-[#0051ff] transition-colors group">
                    <span className="uppercase tracking-wider text-sm">Portfolio</span>
                    <Icon name="arrow-right" size={20} className="group-hover:translate-x-1 transition-transform" />
                  </button>
                </div>
              </div>
              <div className="relative">
                <div className="absolute -top-4 -right-4 w-full h-full border-2 border-[#0051ff]/30"></div>
                <div className="relative z-10 w-full h-[500px] bg-black overflow-hidden">
                  <iframe 
                    width="100%" 
                    height="100%" 
                    src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0&rel=0" 
                    title="YouTube Show Example" 
                    frameBorder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowFullScreen
                    className="w-full h-full object-cover"
                  ></iframe>
                </div>
                <div className="absolute bottom-0 right-0 w-1/2 h-1 bg-[#0051ff]"></div>
              </div>
            </div>
          </div>
        </section>
      );

      const LiveStreamsSection = () => (
        <section className="min-h-screen bg-[#050505] relative overflow-hidden">
          <div className="absolute bottom-0 left-0 w-full h-2 bg-gradient-to-r from-[#0051ff] via-purple-500 to-[#0051ff]"></div>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-24">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
              <div>
                <h2 className="text-5xl md:text-7xl font-black font-exo mb-6 uppercase italic leading-[0.9] text-gray-400 tracking-tighter">
                  LIVE<br/>
                  <span className="metallic-blue">STREAMS</span>
                </h2>
                <div className="inline-block bg-[#0051ff] text-white px-4 py-2 text-sm font-bold uppercase mb-8">
                  With The Best Reviews
                </div>
                <p className="text-gray-400 text-xl leading-relaxed font-light mb-8">
                  We officially declare: you won't find this kind of quality in webinars anywhere else. Premium production for top-tier guests and brands looking to make an impact.
                </p>
                <div className="mb-10">
                  <span className="text-gray-500 text-sm uppercase tracking-widest font-bold">from </span>
                  <span className="text-4xl font-black font-exo metallic-blue">4,500 EGP</span>
                  <span className="text-white text-xl font-bold"> / HOUR</span>
                </div>
                <div className="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-6">
                  <button className="bg-[#0051ff] hover:bg-blue-700 text-white px-10 py-4 rounded-sm font-bold transition-all uppercase tracking-wider text-sm">
                    Book Now
                  </button>
                  <button className="flex items-center space-x-2 text-white font-bold hover:text-[#0051ff] transition-colors group">
                    <span className="uppercase tracking-wider text-sm">Portfolio</span>
                    <Icon name="arrow-right" size={20} className="group-hover:translate-x-1 transition-transform" />
                  </button>
                </div>
              </div>
              <div className="relative">
                <div className="absolute -top-4 -right-4 w-full h-full border-2 border-[#0051ff]/30"></div>
                <div className="relative z-10 w-full h-[500px] bg-black overflow-hidden">
                  <iframe 
                    width="100%" 
                    height="100%" 
                    src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=0&rel=0" 
                    title="Live Stream Example" 
                    frameBorder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowFullScreen
                    className="w-full h-full object-cover"
                  ></iframe>
                </div>
                <div className="absolute bottom-0 right-0 w-1/2 h-1 bg-[#0051ff]"></div>
              </div>
            </div>
          </div>
        </section>
      );

      const CoursesSection = () => (
        <section className="min-h-screen bg-[#050505] relative overflow-hidden">
          <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-[#0051ff] via-purple-500 to-[#0051ff]"></div>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-24">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
              <div>
                <h2 className="text-5xl md:text-7xl font-black font-exo mb-6 uppercase italic leading-[0.9] text-gray-400 tracking-tighter">
                  COURSES
                </h2>
                <div className="inline-block bg-[#0051ff] text-white px-4 py-2 text-sm font-bold uppercase mb-8">
                  For Multi-Million Launches
                </div>
                <p className="text-gray-400 text-xl leading-relaxed font-light mb-8">
                  Vivid imagery, unique backgrounds, amazing sound, top-tier editing — this equals the image and status of your product. Elevate your online courses to premium quality that sells.
                </p>
                <div className="mb-10">
                  <span className="text-gray-500 text-sm uppercase tracking-widest font-bold">from </span>
                  <span className="text-4xl font-black font-exo metallic-blue">3,000 EGP</span>
                  <span className="text-white text-xl font-bold"> / HOUR</span>
                </div>
                <div className="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-6">
                  <button className="bg-[#0051ff] hover:bg-blue-700 text-white px-10 py-4 rounded-sm font-bold transition-all uppercase tracking-wider text-sm">
                    Book Now
                  </button>
                  <button className="flex items-center space-x-2 text-white font-bold hover:text-[#0051ff] transition-colors group">
                    <span className="uppercase tracking-wider text-sm">Portfolio</span>
                    <Icon name="arrow-right" size={20} className="group-hover:translate-x-1 transition-transform" />
                  </button>
                </div>
              </div>
              <div className="relative">
                <div className="absolute -top-4 -right-4 w-full h-full border-2 border-[#0051ff]/30"></div>
                <div className="relative z-10 w-full h-[500px] bg-black overflow-hidden">
                  <iframe 
                    width="100%" 
                    height="100%" 
                    src="https://www.youtube.com/embed/5qap5aO4i9A?autoplay=0&rel=0" 
                    title="Courses Example" 
                    frameBorder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowFullScreen
                    className="w-full h-full object-cover"
                  ></iframe>
                </div>
                <div className="absolute bottom-0 right-0 w-1/2 h-1 bg-[#0051ff]"></div>
              </div>
            </div>
          </div>
        </section>
      );

      const VideoboardSection = () => (
        <section className="min-h-screen bg-[#050505] relative overflow-hidden">
          <div className="absolute bottom-0 left-0 w-full h-2 bg-gradient-to-r from-[#0051ff] via-purple-500 to-[#0051ff]"></div>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-24">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
              <div>
                <h2 className="text-5xl md:text-7xl font-black font-exo mb-6 uppercase italic leading-[0.9] text-gray-400 tracking-tighter">
                  VIDEO<br/>
                  <span className="metallic-blue">BOARD</span>
                </h2>
                <div className="inline-block bg-[#0051ff] text-white px-4 py-2 text-sm font-bold uppercase mb-8">
                  For Expert Videos
                </div>
                <p className="text-gray-400 text-xl leading-relaxed font-light mb-8">
                  Magic, nothing else! You write with a marker, and glowing text appears in the frame as if floating in the air. Perfect for educational content, presentations, and expert tutorials.
                </p>
                <div className="mb-10">
                  <span className="text-gray-500 text-sm uppercase tracking-widest font-bold">from </span>
                  <span className="text-4xl font-black font-exo metallic-blue">2,000 EGP</span>
                  <span className="text-white text-xl font-bold"> / HOUR</span>
                </div>
                <div className="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-6">
                  <button className="bg-[#0051ff] hover:bg-blue-700 text-white px-10 py-4 rounded-sm font-bold transition-all uppercase tracking-wider text-sm">
                    Book Now
                  </button>
                  <button className="flex items-center space-x-2 text-white font-bold hover:text-[#0051ff] transition-colors group">
                    <span className="uppercase tracking-wider text-sm">Portfolio</span>
                    <Icon name="arrow-right" size={20} className="group-hover:translate-x-1 transition-transform" />
                  </button>
                </div>
              </div>
              <div className="relative">
                <div className="absolute -top-4 -right-4 w-full h-full border-2 border-[#0051ff]/30"></div>
                <div className="relative z-10 w-full h-[500px] bg-black overflow-hidden">
                  <iframe 
                    width="100%" 
                    height="100%" 
                    src="https://www.youtube.com/embed/ScMzIvxBSi4?autoplay=0&rel=0" 
                    title="Videoboard Example" 
                    frameBorder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowFullScreen
                    className="w-full h-full object-cover"
                  ></iframe>
                </div>
                <div className="absolute bottom-0 right-0 w-1/2 h-1 bg-[#0051ff]"></div>
              </div>
            </div>
          </div>
        </section>
      );

      const EquipmentRentalSection = () => {
        const categories = ['Cameras', 'Lighting', 'Microphones', 'Other'];
        
        return (
          <section className="py-24 bg-gradient-to-r from-[#0a0a1a] to-[#050505] relative overflow-hidden">
            <div className="absolute inset-0 bg-gradient-to-br from-[#0051ff]/10 via-transparent to-transparent"></div>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
                <div>
                  <h2 className="text-5xl md:text-6xl font-black font-exo mb-8 uppercase leading-[0.9]">
                    EQUIPMENT<br/>
                    <span className="metallic-blue">RENTAL</span>
                  </h2>
                  
                  <div className="flex flex-wrap gap-3 mb-10">
                    {categories.map((category, index) => (
                      <button
                        key={index}
                        className="px-6 py-2 rounded-full border border-white/20 text-white text-sm font-medium hover:bg-[#0051ff] hover:border-[#0051ff] transition-all duration-300"
                      >
                        {category}
                      </button>
                    ))}
                  </div>
                  
                  <div className="space-y-6 text-gray-400 text-lg leading-relaxed font-light mb-10">
                    <p>
